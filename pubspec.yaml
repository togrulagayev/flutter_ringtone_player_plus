name: flutter_ringtone_player_plus
description: "Play system ringtones, alarms, notification sounds and custom audio on Android and iOS, with looping, volume and playback state."
version: 0.1.0-dev.1
repository: https://github.com/togrulagayev/flutter_ringtone_player_plus
issue_tracker: https://github.com/togrulagayev/flutter_ringtone_player_plus/issues
topics:
  - ringtone
  - alarm
  - notification
  - audio
  - sound

publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.togrulagayev.flutter_ringtone_player_plus
        pluginClass: FlutterRingtonePlayerPlusPlugin
      ios:
        pluginClass: FlutterRingtonePlayerPlusPlugin
